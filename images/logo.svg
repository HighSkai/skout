<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 128 128">
  <title>Skout</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b4a33"/>
      <stop offset="1" stop-color="#0b1f15"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#86efac"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <radialGradient id="glass" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#4ade80" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#4ade80" stop-opacity="0.06"/>
    </radialGradient>
  </defs>

  <!-- Tile -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#tile)"/>
  <rect x="4.75" y="4.75" width="118.5" height="118.5" rx="27.25" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5"/>

  <!-- Handle -->
  <line x1="79" y1="79" x2="103" y2="103" stroke="#0b1f15" stroke-opacity="0.55" stroke-width="17" stroke-linecap="round"/>
  <line x1="79" y1="79" x2="102" y2="102" stroke="url(#ring)" stroke-width="13" stroke-linecap="round"/>

  <!-- Lens -->
  <circle cx="55" cy="55" r="33" fill="url(#glass)"/>
  <circle cx="55" cy="55" r="33" fill="none" stroke="url(#ring)" stroke-width="9"/>

  <!-- Blocky S: a 5 x 7 grid of 6 px blocks, the way Minecraft draws letters -->
  <g fill="#effff5">
    <rect x="46" y="34" width="24" height="6"/>
    <rect x="40" y="40" width="6" height="12"/>
    <rect x="46" y="52" width="18" height="6"/>
    <rect x="64" y="58" width="6" height="12"/>
    <rect x="40" y="70" width="24" height="6"/>
  </g>

  <!-- Glint -->
  <path d="M33 47 A 24 24 0 0 1 47 33" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="3.5" stroke-linecap="round"/>
</svg>
